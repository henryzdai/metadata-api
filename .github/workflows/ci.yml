name: Verify metadata API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: "off"
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Verify dependencies and formatting
        shell: bash
        run: |
          go mod download
          go mod verify
          test -z "$(gofmt -l cmd internal e2e)"
      - name: Vet
        run: go vet ./...
      - name: Unit and storage-contract tests with coverage
        shell: bash
        run: |
          mkdir -p artifacts
          go list -deps ./cmd/... | grep '^metadata-api/' > artifacts/coverage-packages.txt
          cover_packages="$(paste -sd, artifacts/coverage-packages.txt)"
          test -n "$cover_packages"
          go test -count=1 -shuffle=on -coverpkg="$cover_packages" -coverprofile=coverage.out ./internal/... ./cmd/...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          {
            echo '### Unit and storage-contract coverage'
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build a CGO-free executable
        run: go build -o "$RUNNER_TEMP/metadata-server" ./cmd/metadata-server
      - name: Real-process HTTP E2E
        shell: bash
        run: |
          mkdir -p artifacts
          METADATA_SERVER_BIN="$RUNNER_TEMP/metadata-server" \
          E2E_ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts/e2e" \
          go test -count=1 -timeout=3m -v ./e2e | tee artifacts/e2e.log
      - name: Race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -shuffle=on ./internal/... ./cmd/...
      - name: Preserve coverage and E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-api-verification
          path: |
            coverage.out
            coverage-summary.txt
            artifacts/
          retention-days: 14
          if-no-files-found: warn
